<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register - SkillTrack</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body class="auth-page"><div class="auth-box"><h2>Create Account</h2><form id="registerForm"><input class="form-control mb-3" id="name" placeholder="Full name" required><input class="form-control mb-3" id="email" type="email" placeholder="Email" required><input class="form-control mb-3" id="password" type="password" minlength="6" placeholder="Password (6+ characters)" required><button class="btn btn-primary w-100">Register</button></form><div id="message" class="mt-3"></div><p class="mt-3">Already registered? <a href="login.html">Login</a></p></div><script src="js/auth.js"></script></body></html>
